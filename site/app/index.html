<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://gmail.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="3B Mailbox: see, tidy and change your Gmail filters. It runs fully in your browser."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Filters" />
    <title>3B Mailbox</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#main">Skip to main content</a>

    <div class="shell">
      <header class="app-header">
        <a class="brand" href="#/overview">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <rect class="mark-bg" width="64" height="64" rx="16" />
            <path class="mark-fg" d="M15 19h34l-12.5 15v11l-9 5V34z" />
          </svg>
          <span class="brand-name">3B Mailbox</span>
        </a>
        <div class="header-end">
          <div id="auth-status" class="auth-status" role="status"></div>
          <div id="auth-action" class="auth-action"></div>
        </div>
      </header>

      <nav class="app-nav" aria-label="Main">
        <ul class="nav-list">
          <li>
            <a class="nav-link" href="#/overview" data-route="overview"
              ><span data-icon="overview"></span><span class="nav-text">Overview</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="#/filters" data-route="filters"
              ><span data-icon="filter"></span><span class="nav-text">Filters</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="#/suggestions" data-route="suggestions"
              ><span data-icon="suggest"></span><span class="nav-text">Suggestions</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="#/tidy" data-route="tidy"
              ><span data-icon="tidy"></span><span class="nav-text">Tidy up</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="#/settings" data-route="settings"
              ><span data-icon="settings"></span><span class="nav-text">Settings</span></a
            >
          </li>
        </ul>
        <p class="nav-foot">
          <a href="../index.html">About 3B Mailbox</a>
        </p>
      </nav>

      <main id="main" class="app-main" tabindex="-1">
        <div id="banners" class="banners"></div>
        <div id="view" class="view">
          <noscript>
            <p class="noscript">3B Mailbox needs JavaScript. Turn it on, then reload the page.</p>
          </noscript>
        </div>
      </main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite"></div>
  </body>
</html>
